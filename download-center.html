<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>HSBAU Download Center</title>
    <style>
        :root {
            --hsbau-red: #c8102e;
            --hsbau-dark: #333;
            --hsbau-gray: #757575;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f4f4f4 0%, #e0e0e0 100%);
            margin: 0;
        }
        .download-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            width: 350px;
            text-align: center;
            border-top: 6px solid var(--hsbau-red);
        }
        .logo { width: 120px; margin-bottom: 20px; display: block; margin-left: auto; margin-right: auto; }
        h2 { color: var(--hsbau-dark); margin-bottom: 25px; font-size: 1.4rem; }
        .btn-back {
            display: inline-block;
            margin-bottom: 25px;
            padding: 8px 16px;
            background-color: var(--hsbau-gray);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.3s;
        }
        .btn-back:hover { background-color: #555; }
        .btn {
            display: block;
            margin: 15px 0;
            padding: 14px 20px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
            background-color: var(--hsbau-red);
            font-size: 0.95rem;
        }
        .btn:hover {
            background-color: #a00d25;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(200, 16, 46, 0.3);
        }
    </style>
</head>
<body>

<div class="download-container">
    <a href="index.html" class="btn-back">← Zurück zur Eingabeseite</a>
    
    <img src="icon.png" alt="HSBAU Logo" class="logo">
    
    <h2>Download Center</h2>
    
    <!-- Link zur lokalen Datei -->
    <a href="installation-anleitung.txt" class="btn" target="_blank">
       Installationsanleitung anzeigen
    </a>
    
    <!-- Link zur lokalen Datei -->
    <a href="HSBAU Rapport Vorlage.xlsx" class="btn" download="HSBAU_Rapport_Vorlage.xlsx">
       HSBAU Rapport Excel Vorlage herunterladen
    </a>
</div>

</body>
</html>
