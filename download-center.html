<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>HSBAU Download Center</title>
    <style>
        :root {
            --hsbau-red: #c8102e;
            --hsbau-red-hover: #a00d25;
            --hsbau-dark: #1e293b;
            --hsbau-gray: #64748b;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            margin: 0;
            padding: 20px;
            color: var(--hsbau-dark);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .download-container {
            background: var(--card-bg);
            padding: 40px 32px;
            border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 
                        0 20px 25px -5px rgba(0, 0, 0, 0.1),
                        0 0 0 1px rgba(0, 0, 0, 0.03);
            width: 100%;
            max-width: 380px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-top: 6px solid var(--hsbau-red);
        }
        .logo { 
            width: 120px; 
            margin-bottom: 20px; 
            display: block; 
            margin-left: auto; 
            margin-right: auto; 
            transition: transform 0.3s ease;
        }
        .logo:hover {
            transform: scale(1.04);
        }
        h2 { 
            color: var(--hsbau-dark); 
            margin-bottom: 25px; 
            font-size: 1.5rem; 
            font-weight: 700;
            letter-spacing: -0.025em;
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            padding: 10px 20px;
            background-color: #f1f5f9;
            color: var(--hsbau-gray);
            text-decoration: none;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.25s ease;
            border: 1px solid var(--border-color);
        }
        .btn-back:hover { 
            background-color: #e2e8f0; 
            color: var(--hsbau-dark);
            transform: translateX(-2px);
        }
        .btn {
            display: block;
            margin: 15px 0;
            padding: 16px 20px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: var(--hsbau-red);
            font-size: 0.95rem;
            box-shadow: 0 4px 6px -1px rgba(200, 16, 46, 0.12), 0 2px 4px -1px rgba(200, 16, 46, 0.08);
        }
        .btn:hover {
            background-color: var(--hsbau-red-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(200, 16, 46, 0.3);
        }
        .btn:active {
            transform: translateY(0);
            box-shadow: 0 4px 6px -1px rgba(200, 16, 46, 0.12);
        }
    </style>
</head>
<body>

<div class="download-container">
    <a href="index.html" class="btn-back">← Zurück zur Eingabeseite</a>
    
    <img src="icon.png" alt="HSBAU Logo" class="logo">
    
    <h2>Download Center</h2>
    
    <a href="installation-anleitung.txt" class="btn" target="_blank">
       Installationsanleitung anzeigen
    </a>
    
    <a href="HSBAU Rapport Vorlage.xlsx" class="btn" download="HSBAU_Rapport_Vorlage.xlsx">
       HSBAU Rapport Excel Vorlage herunterladen
    </a>
</div>

</body>
</html>
